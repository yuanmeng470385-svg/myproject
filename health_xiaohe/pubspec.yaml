name: health_xiaohe
description: "健康小荷 AI健康助手应用"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^13.0.0

  # UI Components
  flutter_svg: ^2.0.9

  # Utilities
  intl: ^0.18.1
  get_it: ^7.6.4
  flutter_markdown: ^0.7.6

  # Camera (Android)
  camera: ^0.10.5
  # YUV420 摄像头帧 → JPEG 转码（在 isolate 内，见 camera_capture_android.dart）
  image: ^4.0.0
  # 线性图标库(底部导航等)
  # File system
  path_provider: ^2.1.1
  lucide_icons_flutter: ^3.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

  fonts:
    # 宋体大标题(简体子集,见 AppTypography.serif)
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifSC-SemiBold.ttf
          weight: 600
    # 英数/数字衬线(可变字体,wght 轴随 fontWeight 映射,见 AppTypography.fraunces)
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
